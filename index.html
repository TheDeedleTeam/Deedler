<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Deedler Browser</title>
  <style>
    @font-face {
      font-family: 'Coolvetica';
      src: url('./assets/coolvetica.otf') format('opentype'),
           url('./assets/coolvetica.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --accent: #ff9500;
      --accent-rgb: 255, 149, 0;
      --bg-0: #0d0d0f;
      --bg-1: #121214;
      --bg-2: #1d1d21;
      --text: #f0f0f5;
      --muted: #8e8e93;
      --line: rgba(255, 255, 255, 0.07);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Coolvetica', -apple-system, 'Segoe UI', sans-serif; }
    body { background: var(--bg-0); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    button { color: inherit; font-family: inherit; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }

    /* ───── Barra superior / abas ───── */
    #top-bar { display: flex; align-items: flex-end; background: var(--bg-1); padding: 8px 12px 0 12px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
    #brand { display: flex; align-items: center; gap: 8px; padding: 0 14px 6px 0; font-weight: 700; font-size: 18px; color: var(--accent); user-select: none; }
    #brand img { width: 22px; height: 22px; object-fit: contain; }
    #tabs-container { display: flex; gap: 4px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
    #tabs-container::-webkit-scrollbar { display: none; }
    #add-tab-btn { background: transparent; border: none; padding: 0 10px 8px; cursor: pointer; display: flex; align-items: center; flex-shrink: 0; }
    #add-tab-btn img { width: 18px; height: 18px; object-fit: contain; }
    #add-tab-btn:hover img { transform: scale(1.2); }

    .tab {
      position: relative; display: flex; align-items: center; gap: 6px;
      flex: 0 1 190px; min-width: 46px; max-width: 190px; height: 32px; padding: 0 8px;
      background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line); border-bottom: none;
      border-radius: 8px 8px 0 0; font-size: 13px; color: #a0a0b0; cursor: pointer; user-select: none;
      transition: background 0.15s, color 0.15s;
    }
    .tab:hover { background: rgba(255, 255, 255, 0.07); }
    .tab.active { background: var(--bg-2); color: #fff; box-shadow: inset 0 -2px 0 var(--accent); }
    .tab.pinned { flex: 0 0 40px; min-width: 40px; justify-content: center; padding: 0; }
    .tab.pinned .tab-title, .tab.pinned .close-btn { display: none; }
    .tab.dragging { opacity: 0.4; }
    .tab.drop-before { box-shadow: inset 3px 0 0 var(--accent); }
    .tab.drop-after { box-shadow: inset -3px 0 0 var(--accent); }
    .tab-icon { width: 16px; height: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; }
    .tab-icon img { width: 16px; height: 16px; object-fit: contain; border-radius: 3px; }
    .tab-spinner { width: 14px; height: 14px; flex-shrink: 0; display: none; border: 2px solid rgba(255, 255, 255, 0.15); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    .tab.loading .tab-spinner { display: block; }
    .tab.loading .tab-icon { display: none; }
    .tab-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .tab-audio { display: none; background: none; border: none; font-size: 12px; cursor: pointer; flex-shrink: 0; }
    .tab.audible .tab-audio, .tab.muted .tab-audio { display: block; }
    .tab .close-btn { font-size: 14px; opacity: 0.6; border-radius: 50%; padding: 0 5px; flex-shrink: 0; }
    .tab .close-btn:hover { opacity: 1; background: rgba(255, 255, 255, 0.2); }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ───── Barra de navegação ───── */
    #nav-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bg-2); border-bottom: 1px solid var(--line); flex-shrink: 0; }
    .nav-btn {
      position: relative; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08);
      width: 34px; height: 34px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: 0.2s; flex-shrink: 0; font-size: 15px;
    }
    .nav-btn img { width: 18px; height: 18px; object-fit: contain; }
    .nav-btn:hover:not(:disabled) { background: var(--accent); }
    .nav-btn:disabled { opacity: 0.3; cursor: default; }
    .nav-btn.on { background: rgba(var(--accent-rgb), 0.35); border-color: var(--accent); }
    #btn-zoom { display: none; width: auto; padding: 0 10px; font-size: 12px; }
    #btn-zoom.visible { display: flex; }
    .badge { position: absolute; top: -5px; right: -5px; background: var(--accent); color: #000; border-radius: 9px; font-size: 10px; min-width: 16px; height: 16px; display: none; align-items: center; justify-content: center; }
    .badge.visible { display: flex; }

    #url-wrap { flex: 1; position: relative; display: flex; align-items: center; }
    #site-info { position: absolute; left: 13px; font-size: 12px; pointer-events: none; }
    #url-bar {
      width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(var(--accent-rgb), 0.3); color: #fff;
      padding: 7px 38px 7px 34px; border-radius: 20px; outline: none; font-size: 14px;
    }
    #url-bar:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.25); }
    #btn-star { position: absolute; right: 10px; background: none; border: none; font-size: 17px; cursor: pointer; color: var(--muted); }
    #btn-star:hover, #btn-star.on { color: var(--accent); }

    #suggestions, #palette-box {
      background: rgba(25, 25, 28, 0.98); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; padding: 6px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.6);
    }
    #suggestions { position: absolute; top: calc(100% + 6px); left: 0; right: 0; display: none; z-index: 3000; }
    #suggestions.visible { display: block; }
    .sugg { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .sugg.sel, .sugg:hover { background: rgba(var(--accent-rgb), 0.2); }
    .s-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .s-sub { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; max-width: 42%; overflow: hidden; text-overflow: ellipsis; padding-left: 10px; }

    #load-bar { height: 2px; position: relative; overflow: hidden; flex-shrink: 0; }
    #load-bar.active::before { content: ''; position: absolute; top: 0; bottom: 0; width: 35%; background: var(--accent); animation: load 1s ease-in-out infinite; }
    @keyframes load { 0% { left: -35%; } 100% { left: 100%; } }

    /* ───── Barra de favoritos ───── */
    #bookmarks-bar { display: none; gap: 6px; padding: 4px 12px; background: var(--bg-2); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
    #bookmarks-bar.visible { display: flex; }
    .bm-chip { display: flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 12px; font-size: 12px; background: rgba(255, 255, 255, 0.04); border: none; cursor: pointer; white-space: nowrap; max-width: 170px; }
    .bm-chip span:last-child { overflow: hidden; text-overflow: ellipsis; }
    .bm-chip:hover { background: rgba(var(--accent-rgb), 0.28); }
    .bm-avatar { border-radius: 4px; font-size: 10px; display: inline-flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }

    /* ───── Painéis de aba ───── */
    #views-container { flex: 1; position: relative; min-height: 0; }
    .tab-pane { position: absolute; inset: 0; visibility: hidden; pointer-events: none; }
    .tab-pane.active { visibility: visible; pointer-events: auto; }
    .tab-pane webview { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
    .tab-pane[data-mode="web"] webview { display: flex; }

    .pane-home, .pane-error { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; overflow: auto; padding: 24px; }
    .pane-home { background: radial-gradient(circle at 50% 0%, rgba(var(--accent-rgb), 0.16), transparent 60%), var(--bg-1); }
    .pane-error { background: var(--bg-1); text-align: center; z-index: 5; }
    .tab-pane[data-mode="home"] .pane-home { display: flex; }
    .tab-pane[data-error="1"] .pane-error { display: flex; }

    .home-clock { font-size: 54px; font-weight: 800; letter-spacing: 2px; }
    .home-greet { font-size: 15px; color: var(--muted); margin-top: -12px; }
    .home-card {
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px);
      padding: 32px; border-radius: 24px; display: flex; flex-direction: column; align-items: center; gap: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); width: 90%; max-width: 500px;
    }
    .home-logo-img { width: 70px; height: 70px; object-fit: contain; }
    .home-title { font-size: 36px; font-weight: 800; color: var(--accent); }
    .home-subtitle { font-size: 14px; color: var(--muted); }
    .home-search-bar { width: 100%; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(var(--accent-rgb), 0.4); padding: 12px 18px; border-radius: 30px; color: #fff; font-size: 15px; outline: none; }
    .home-search-bar:focus { border-color: var(--accent); }
    .dial { display: grid; grid-template-columns: repeat(4, 96px); gap: 14px; }
    .dial-tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; font-size: 12px; transition: 0.15s; }
    .dial-tile span:last-child { max-width: 88px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dial-tile:hover { background: rgba(var(--accent-rgb), 0.18); transform: translateY(-2px); }
    .dial-tile .bm-avatar { border-radius: 12px; font-size: 20px; }
    .home-tip { font-size: 12px; color: var(--muted); }

    .err-emoji { font-size: 54px; }
    .err-title { font-size: 26px; color: var(--accent); }
    .err-msg { font-size: 15px; }
    .err-code { font-size: 11px; color: var(--muted); max-width: 520px; word-break: break-all; }

    .btn { background: rgba(var(--accent-rgb), 0.2); border: 1px solid rgba(var(--accent-rgb), 0.5); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 12px; transition: 0.15s; white-space: nowrap; }
    .btn:hover { background: var(--accent); color: #000; }
    .btn.wide { width: 100%; padding: 9px; }

    /* ───── Painel lateral ───── */
    #sidebar-panel {
      position: fixed; right: 12px; top: 100px; width: 380px; max-height: calc(100vh - 120px);
      background: rgba(25, 25, 28, 0.96); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px; padding: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 1000; display: none; flex-direction: column; gap: 10px;
    }
    #sidebar-panel.visible { display: flex; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 8px; }
    .panel-title { font-weight: bold; color: var(--accent); font-size: 16px; }
    #btn-close-panel { width: 26px; height: 26px; font-size: 14px; }
    #panel-tools { display: flex; gap: 8px; }
    #panel-tools:empty { display: none; }
    .panel-input { flex: 1; background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(var(--accent-rgb), 0.3); color: #fff; padding: 6px 10px; border-radius: 8px; outline: none; font-size: 13px; }
    .panel-input:focus { border-color: var(--accent); }
    select.panel-input { flex: 0 0 auto; }
    .panel-list { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 13px; min-height: 40px; }
    .panel-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: rgba(255, 255, 255, 0.05); padding: 8px 10px; border-radius: 8px; }
    .panel-item.col { flex-direction: column; align-items: stretch; gap: 4px; }
    .panel-item.clickable { cursor: pointer; }
    .panel-item.clickable:hover { background: rgba(var(--accent-rgb), 0.18); }
    .pi-main { display: flex; flex-direction: column; min-width: 0; }
    .pi-main strong, .panel-item.col strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .panel-item small, .pi-main small { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .panel-day { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; }
    .panel-empty { color: var(--muted); text-align: center; padding: 18px 0; }
    .x-btn { background: none; border: none; cursor: pointer; font-size: 16px; opacity: 0.5; flex-shrink: 0; }
    .x-btn:hover { opacity: 1; color: #ff5a5a; }
    .dl-bar { height: 5px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; overflow: hidden; }
    .dl-bar > div { height: 100%; background: var(--accent); transition: width 0.2s; }
    .dl-actions { display: flex; gap: 6px; margin-top: 2px; }
    .setting-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 10px; background: rgba(255, 255, 255, 0.05); border-radius: 8px; font-size: 13px; }
    .setting-row input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }
    .color-input { width: 38px; height: 26px; border: none; background: none; cursor: pointer; }
    select.panel-input option { background: #1d1d21; }

    /* ───── Buscar na página ───── */
    #find-bar { position: fixed; top: 100px; right: 24px; display: none; align-items: center; gap: 6px; padding: 8px 10px; background: rgba(25, 25, 28, 0.97); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); z-index: 1500; }
    #find-bar.visible { display: flex; }
    #find-input { width: 190px; }
    #find-count { font-size: 12px; color: var(--muted); min-width: 40px; text-align: center; }
    #find-bar .nav-btn { width: 28px; height: 28px; font-size: 12px; }

    /* ───── Paleta de comandos ───── */
    #palette { position: fixed; inset: 0; display: none; align-items: flex-start; justify-content: center; padding-top: 14vh; background: rgba(0, 0, 0, 0.45); z-index: 4000; }
    #palette.visible { display: flex; }
    #palette-box { width: min(620px, 92vw); display: flex; flex-direction: column; gap: 6px; }
    #palette-input { width: 100%; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(var(--accent-rgb), 0.4); color: #fff; padding: 11px 14px; border-radius: 10px; font-size: 15px; outline: none; }
    #palette-list { max-height: 50vh; overflow-y: auto; }

    /* ───── Menu flutuante / toasts ───── */
    #ctx-menu { position: fixed; display: none; min-width: 200px; background: rgba(25, 25, 28, 0.98); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px; padding: 5px; z-index: 5000; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); }
    #ctx-menu.visible { display: block; }
    .ctx-item { padding: 7px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .ctx-item:hover { background: rgba(var(--accent-rgb), 0.25); }
    .ctx-item.disabled { opacity: 0.35; cursor: default; }
    .ctx-item.disabled:hover { background: none; }
    .ctx-sep { height: 1px; background: rgba(255, 255, 255, 0.1); margin: 4px 0; }

    #toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 6000; pointer-events: none; }
    .toast { background: rgba(30, 30, 34, 0.97); border: 1px solid rgba(var(--accent-rgb), 0.5); padding: 9px 16px; border-radius: 20px; font-size: 13px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5); animation: toast-in 0.25s ease-out; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* ───── Estados globais ───── */
    body.html-fs #top-bar, body.html-fs #nav-bar, body.html-fs #bookmarks-bar, body.html-fs #load-bar { display: none; }
    body.rainbow #top-bar, body.rainbow #nav-bar { animation: hue 5s linear infinite; }
    @keyframes hue { to { filter: hue-rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Barra Superior -->
  <div id="top-bar">
    <div id="brand">
      <img src="./assets/icon.png" alt="deedler"> deedler
    </div>
    <div id="tabs-container"></div>
    <button id="add-tab-btn" title="Nova aba (Ctrl+T)">
      <img src="./assets/icon-add.png" alt="+">
    </button>
  </div>

  <!-- Barra de Navegação -->
  <div id="nav-bar">
    <button class="nav-btn" id="btn-back" title="Voltar (Alt+←)">
      <img src="./assets/icon-back.png" alt="←">
    </button>
    <button class="nav-btn" id="btn-forward" title="Avançar (Alt+→)">
      <img src="./assets/icon-forward.png" alt="→">
    </button>
    <button class="nav-btn" id="btn-reload" title="Recarregar / parar (Ctrl+R)">
      <img src="./assets/icon-reload.png" alt="↻">
    </button>

    <div id="url-wrap">
      <span id="site-info"></span>
      <input type="text" id="url-bar" placeholder="Digite uma URL ou termo de busca..." autocomplete="off" spellcheck="false" />
      <button id="btn-star" title="Favoritar (Ctrl+D)">☆</button>
      <div id="suggestions"></div>
    </div>

    <button class="nav-btn" id="btn-zoom" title="Clique para voltar a 100%">100%</button>
    <button class="nav-btn" id="btn-dark" title="Modo escuro forçado (Ctrl+Shift+D)">🌓</button>
    <button class="nav-btn" id="btn-shot" title="Capturar tela (Ctrl+Shift+S)">📸</button>
    <button class="nav-btn" id="btn-bookmarks" title="Favoritos (Ctrl+B)">🔖</button>
    <button class="nav-btn" id="btn-history" title="Histórico (Ctrl+H)">
      <img src="./assets/icon-history.png" alt="Histórico">
    </button>
    <button class="nav-btn" id="btn-downloads" title="Downloads (Ctrl+J)">
      <img src="./assets/icon-downloads.png" alt="Downloads">
      <span class="badge" id="dl-badge">0</span>
    </button>
    <button class="nav-btn" id="btn-settings" title="Configurações">
      <img src="./assets/icon-settings.png" alt="Configs">
    </button>
  </div>
  <div id="load-bar"></div>
  <div id="bookmarks-bar"></div>

  <div id="views-container"></div>

  <!-- Painel Lateral -->
  <div id="sidebar-panel">
    <div class="panel-header">
      <span class="panel-title" id="panel-title">Painel</span>
      <button class="nav-btn" id="btn-close-panel" title="Fechar (Esc)">×</button>
    </div>
    <div id="panel-tools"></div>
    <div class="panel-list" id="panel-list"></div>
  </div>

  <!-- Buscar na página -->
  <div id="find-bar">
    <input type="text" class="panel-input" id="find-input" placeholder="Buscar na página…" />
    <span id="find-count"></span>
    <button class="nav-btn" id="find-prev" title="Anterior (Shift+Enter)">▲</button>
    <button class="nav-btn" id="find-next" title="Próximo (Enter)">▼</button>
    <button class="nav-btn" id="find-close" title="Fechar (Esc)">×</button>
  </div>

  <!-- Paleta de comandos -->
  <div id="palette">
    <div id="palette-box">
      <input type="text" id="palette-input" placeholder="Digite um comando, aba ou favorito…" autocomplete="off" spellcheck="false" />
      <div id="palette-list"></div>
    </div>
  </div>

  <div id="ctx-menu"></div>
  <div id="toasts"></div>

  <script src="renderer.js"></script>
</body>
</html>
